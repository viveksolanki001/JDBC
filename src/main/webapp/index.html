<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Management System</h1>
            <p class="subtitle">Java Servlet &amp; JDBC Demonstration</p>
        </header>

        <form action="students" method="post">
            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name" placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="student@example.com" required>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <input type="text" id="course" name="course" placeholder="e.g. MCA, B.Tech, BCA" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g. 21" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Student</button>
                <a href="students" class="btn btn-secondary">View All Students</a>
            </div>
        </form>
    </div>
</body>
</html>
